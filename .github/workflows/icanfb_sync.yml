name: ICanFB Fixture Sync

on:
  schedule:
    # Her 6 saatte bir, saat başını 30 geçe çalışır (UTC 00:30, 06:30, 12:30, 18:30)
    - cron: '30 */6 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'icanfb/*.py'
      - 'icanfb/requirements.txt'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd icanfb
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd icanfb
          python scraper.py

      - name: Update Sync Timestamp (Keep Workflow Active)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          echo "Last successful fixture sync: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > icanfb/last_sync.txt
          git add icanfb/last_sync.txt
          git diff-index --quiet HEAD || (git commit -m "Otomatik fikstür senkronizasyon kaydı [skip ci]" && git push)